name: Build macOS app

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: write      # needed to create/update the Release

# The Windows and Mac workflows both upload to the SAME release. Two jobs writing to
# one release at once makes GitHub's asset API return 500s, so share one concurrency
# group across both workflows: the second waits for the first instead of racing it.
concurrency:
  group: release-upload
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # macOS icons must be at least 512×512. The shared icon.png is 256, so upscale a
      # 1024 copy for the .icns electron-builder generates. (sips ships with macOS.)
      - name: Prepare macOS icon
        run: sips -z 1024 1024 assets/icon.png --out build/icon.png

      # Unsigned build: tell electron-builder not to look for a signing certificate, so
      # CI never tries (and fails) to sign. The app runs after a one-time right-click → Open.
      - name: Build the .dmg (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the Mac app as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandbyCue-Presentation-Timer-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish the Mac app to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: StandbyCue Presentation timer v${{ steps.v.outputs.version }}
          files: dist/*.dmg
          fail_on_unmatched_files: true
