name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: write      # needed to create the Release

# Shared with build-mac.yml: the two workflows upload to the SAME release, so this
# concurrency group makes them take turns instead of writing at once (which makes
# GitHub's asset API return 500s).
concurrency:
  group: release-upload
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the portable .exe
        run: npm run dist

      - name: Read version from package.json
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload the .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandbyCue-Presentation-Timer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish a Release with the .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: StandbyCue Presentation timer v${{ steps.v.outputs.version }}
          files: dist/*.exe
          fail_on_unmatched_files: true
