name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the portable .exe
        run: npm run dist

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: StandbyCue-Presentation-timer
          path: dist/*.exe
          if-no-files-found: error
